name: Feature request
description: Suggest a clearer control, check, or workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks or tradeoffs
